services:
  - type: web
    name: mbbank-telegram-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "30"
      - key: HISTORY_DAYS
        value: "3"
      - key: CAPTCHA_TIMEOUT_SECONDS
        value: "240"
      - key: DATA_DIR
        value: "data"
